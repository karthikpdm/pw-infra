version: 0.2

phases:
  install:
    commands:
      - echo "Downloading and installing Terraform..."
      - curl -o terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
      - unzip terraform.zip
      - mv terraform /usr/local/bin/
      - terraform --version  # Verify Terraform installation
      - echo "Installing dependencies for Lambda function packaging..."
      - yum install -y zip python3-pip  # Ensure necessary tools for packaging are installed
      - pip3 install --upgrade pip  # Upgrade pip

  pre_build:
    commands:
      - echo "Terraform execution started on `date`"
      - echo "Current working directory $(pwd)"
      - ls -la
      - echo "Setting up environment..."
      - export TF_VAR_region=$AWS_DEFAULT_REGION
      - export TF_VAR_lambda_package_path="modules/python-files/mlpipeline_lambda_function.zip"
      
  build:
    commands:
      - ls -la
      - echo "Copying backend configuration"
      - cp $ENV_DIR/backend.tf .
      - ls
      - cat backend.tf
      - terraform init
      - echo "Importing SageMaker endpoint..."
      - terraform apply -auto-approve -var-file=$ENV_DIR/terraform.tfvars
      - echo "Contents of current directory:"
      - ls -la

artifacts:
  files:
    - $ENV_DIR/**/*
  name: terraform-plan-output

